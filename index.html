<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVAC Diagnose AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f4f8; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h1, h2 { color: #0275d8; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; }
        select, textarea, input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; height: 80px; }
        button { width: 100%; padding: 15px; background-color: #0275d8; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 16px; transition: background 0.3s; }
        button:hover { background-color: #025aa5; }
        button:disabled { background-color: #a0c4e8; cursor: not-allowed; }
        
        .ai-section { border-top: 2px dashed #ccc; margin-top: 30px; padding-top: 20px; }
        #result { margin-top: 20px; padding: 15px; background: #e9f5ff; border-radius: 8px; display: none; border: 1px solid #bce0fd; white-space: pre-wrap; line-height: 1.6; }
        .cause-item { background: white; padding: 10px; margin-bottom: 10px; border-right: 4px solid #0275d8; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .prob { color: #d9534f; font-weight: bold; }
        .loading { text-align: center; color: #0275d8; font-weight: bold; display: none; margin-top: 15px; }
        
        /* أزرار التقييم */
        .feedback-btns { display: flex; gap: 10px; margin-top: 15px; }
        .feedback-btns button { padding: 10px; margin-top: 0; }
        .btn-correct { background-color: #5cb85c; }
        .btn-wrong { background-color: #d9534f; }

        .history-section { border-top: 2px solid #0275d8; margin-top: 40px; padding-top: 20px; }
        .history-item { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 8px; font-size: 14px; position: relative;}
        .history-date { color: #888; font-size: 12px; margin-bottom: 5px; }
        .history-text { font-weight: bold; color: #333; margin-bottom: 5px; padding-left: 25px;}
        .history-result { color: #555; font-size: 13px; background: white; padding: 8px; border-radius: 4px; max-height: 120px; overflow-y: auto; }
        .delete-btn { position: absolute; top: 10px; left: 10px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-weight: bold; padding: 0; line-height: 1; }
        .clear-btn { background-color: #d9534f; margin-top: 10px; padding: 10px; font-size: 14px; }
        
        .catalog-section { background-color: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-top: 30px; }
        .catalog-section h3 { color: #856404; margin-top: 0; text-align: center;}
        .catalog-item { background: white; padding: 10px; border-radius: 5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
        .catalog-item a { color: #0275d8; text-decoration: none; font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h1>❄ HVAC Diagnose AI</h1>
    <p class="subtitle">مساعدك الذكي الذي يتطور مع الوقت</p>

    <div class="ai-section">
        <h2>🤖 التشخيص المتقدم</h2>
        <label for="problemText">اكتب سؤالك أو وصف العطل:</label>
        <textarea id="problemText" placeholder="مثال: كود E5 في كتالوج LG..."></textarea>
        
        <label for="imageInput">أرفق صورة أو كتالوج (PDF):</label>
        <input type="file" id="imageInput" accept="image/*,application/pdf">
        
        <button id="aiBtn" onclick="diagnoseWithAI()">✨ إرسال للذكاء الاصطناعي</button>
        <div id="loading" class="loading">جاري قراءة الملف والتحليل... ⏳</div>
    </div>

    <div id="result">
        <!-- سيتم وضع النتيجة هنا -->
        <div id="aiResponseText"></div>
        
        <!-- أزرار التقييم (التعلم) -->
        <div class="feedback-btns" id="feedbackArea" style="display:none;">
            <p style="width:100%; text-align:center; margin-bottom:5px; font-size:14px; font-weight:bold;">هل هذه الإجابة صحيحة؟</p>
            <button class="btn-correct" onclick="submitFeedback(true)">👍 نعم (تعلم منها)</button>
            <button class="btn-wrong" onclick="submitFeedback(false)">👎 لا (صححها)</button>
        </div>
    </div>

    <div class="catalog-section">
        <h3>📖 مكتبة الكتالوجات (الروابط)</h3>
        <input type="text" id="catalogName" placeholder="اسم الكتالوج/الجهاز">
        <input type="text" id="catalogLink" placeholder="https://..." style="margin-top:5px;">
        <button class="save-btn" style="background-color: #f0ad4e;" onclick="saveCatalogLink()">💾 حفظ الرابط</button>
        <div id="catalogList" class="catalog-item-list"></div>
    </div>

    <div class="history-section">
        <h2>📚 سجل التشخيصات</h2>
        <div id="historyList"></div>
        <button class="clear-btn" onclick="clearHistory()">🗑️ مسح السجل بالكامل</button>
    </div>
</div>

<script>
    let currentAIPrompt = "";
    let currentAIResponse = "";

    // --- 1. دالة الذكاء الاصطناعي مع الذاكرة السياقية ---
    async function diagnoseWithAI() {
        const promptText = document.getElementById("problemText").value;
        const fileInput = document.getElementById("imageInput");
        const resultDiv = document.getElementById("result");
        const aiResponseText = document.getElementById("aiResponseText");
        const btn = document.getElementById("aiBtn");
        const loading = document.getElementById("loading");
        const feedbackArea = document.getElementById("feedbackArea");

        if (!promptText && !fileInput.files[0]) {
            alert("الرجاء كتابة سؤال أو إرفاق صورة/كتالوج.");
            return;
        }

        btn.disabled = true;
        loading.style.display = "block";
        resultDiv.style.display = "none";
        feedbackArea.style.display = "none";

        let fileData = null;
        let fileMimeType = null;

        // ... (كود قراءة الملفات وضغط الصور كما هو) ...
        if (fileInput.files[0]) {
            const file = fileInput.files[0];
            fileMimeType = file.type;
            if (file.type === "application/pdf") {
                fileData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            } else {
                fileData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_SIZE = 800; 
                            let width = img.width, height = img.height;
                            if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
                            else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                            canvas.width = width; canvas.height = height;
                            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
                fileMimeType = "image/jpeg"; 
            }
        }

        // --- 🌟 الذاكرة السياقية (Contextual Memory) 🌟 ---
        // جلب آخر 3 أعطال من السجل لإرسالها للذكاء الاصطناعي ليتعلم منها
        let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
        let pastContext = "";
        if (history.length > 0) {
            pastContext = "إليك سياق من التشخيصات السابقة لتتعلم منها وتكون أكثر ذكاءً:\n";
            history.slice(0, 3).forEach((item, index) => {
                pastContext += `[سياق ${index+1}]: ${item.title} -> ${item.result.substring(0, 100)}...\n`;
            });
        }

        // دمج السياق مع السؤال الجديد
        const fullPrompt = `${pastContext}
        أنت خبير في هندسة التبريد والتكييف. 
        سؤال المستخدم الحالي: "${promptText}". 
        إذا أرفق المستخدم كتالوج أو صورة، ابحث فيها عن إجابة دقيقة. 
        أجب باللغة العربية بأسلوب فني واضح ومختصر.`;

        try {
            const response = await fetch("/api/diagnose", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: fullPrompt, fileData: fileData, mimeType: fileMimeType })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error);

            currentAIPrompt = promptText;
            currentAIResponse = data.result;

            aiResponseText.innerHTML = `<h3>🤖 رد الذكاء الاصطناعي:</h3><p>${data.result.replace(/\n/g, '<br>')}</p>`;
            resultDiv.style.display = "block";
            feedbackArea.style.display = "flex"; // إظهار أزرار التقييم

        } catch (error) {
            aiResponseText.innerHTML = `<p style="color:red;">حدث خطأ: ${error.message}</p>`;
            resultDiv.style.display = "block";
        } finally {
            btn.disabled = false;
            loading.style.display = "none";
        }
    }

    // --- 2. دالة التقييم والتعلم (Feedback Loop) ---
    function submitFeedback(isCorrect) {
        if (isCorrect) {
            // إذا كانت الإجابة صحيحة، نحفظها في السجل كمرجع قوي
            saveToHistory("✅ تم تأكيده: " + currentAIPrompt, currentAIResponse);
            alert("شكراً! تم حفظ هذه الإجابة في سجل النجاحات ليتعلم منها الذكاء الاصطناعي مستقبلاً.");
            document.getElementById("feedbackArea").style.display = "none";
        } else {
            // إذا كانت خاطئة، نطلب التصحيح
            const correction = prompt("نعتذر عن ذلك. يرجى كتابة الإجابة الصحيحة أو التصحيح (سيتم إرسالها للذكاء الاصطناعي ليتعلم منها):");
            if (correction) {
                let corrections = JSON.parse(localStorage.getItem("hvacCorrections")) || [];
                corrections.push({ wrong: currentAIResponse, correct: correction });
                localStorage.setItem("hvacCorrections", JSON.stringify(corrections));
                
                saveToHistory("⚠️ تصحيح: " + currentAIPrompt, correction);
                alert("تم حفظ التصحيح! سيتذكره الذكاء الاصطناعي في المرات القادمة.");
                document.getElementById("feedbackArea").style.display = "none";
            }
        }
    }

    // ... (باقي الدوال الخاصة بالسجل والكتالوجات والبحث المحلي كما هي) ...
    function saveToHistory(title, resultText) {
        let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
        const newRecord = { id: Date.now(), date: new Date().toLocaleString('ar-EG'), title: title, result: resultText };
        history.unshift(newRecord); 
        if (history.length > 50) history = history.slice(0, 50); 
        localStorage.setItem("hvacHistory", JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const historyList = document.getElementById("historyList");
        let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
        if (history.length === 0) {
            historyList.innerHTML = "<p style='text-align:center; color:#888;'>لا توجد أعطال محفوظة.</p>";
            return;
        }
        let html = "";
        history.forEach(item => {
            html += `
            <div class="history-item">
                <button class="delete-btn" onclick="deleteHistory(${item.id})">×</button>
                <div class="history-date">🕒 ${item.date}</div>
                <div class="history-text">${item.title}</div>
                <div class="history-result">${item.result.replace(/\n/g, '<br>')}</div>
            </div>`;
        });
        historyList.innerHTML = html;
    }

    function deleteHistory(id) {
        if (confirm("حذف هذا العطل؟")) {
            let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
            history = history.filter(item => item.id !== id);
            localStorage.setItem("hvacHistory", JSON.stringify(history));
            renderHistory();
        }
    }

    function clearHistory() {
        if (confirm("مسح كل السجل؟")) {
            localStorage.removeItem("hvacHistory");
            renderHistory();
        }
    }

    function saveCatalogLink() {
        const name = document.getElementById("catalogName").value.trim();
        const link = document.getElementById("catalogLink").value.trim();
        if (!name || !link) { alert("الرجاء كتابة الاسم والرابط."); return; }
        let catalogs = JSON.parse(localStorage.getItem("hvacCatalogs")) || [];
        catalogs.push({ name: name, link: link });
        localStorage.setItem("hvacCatalogs", JSON.stringify(catalogs));
        document.getElementById("catalogName").value = "";
        document.getElementById("catalogLink").value = "";
        renderCatalogs();
    }

    function renderCatalogs() {
        const catalogList = document.getElementById("catalogList");
        let catalogs = JSON.parse(localStorage.getItem("hvacCatalogs")) || [];
        if (catalogs.length === 0) {
            catalogList.innerHTML = "<p style='text-align:center; font-size:12px; color:#888;'>لا توجد كتالوجات محفوظة.</p>";
            return;
        }
        let html = "";
        catalogs.forEach((item, index) => {
            html += `
            <div class="catalog-item">
                <a href="${item.link}" target="_blank">📄 ${item.name}</a>
                <button class="delete-btn" style="position:static; border-radius:5px; width:30px; height:30px;" onclick="deleteCatalog(${index})">×</button>
            </div>`;
        });
        catalogList.innerHTML = html;
    }

    function deleteCatalog(index) {
        let catalogs = JSON.parse(localStorage.getItem("hvacCatalogs")) || [];
        catalogs.splice(index, 1);
        localStorage.setItem("hvacCatalogs", JSON.stringify(catalogs));
        renderCatalogs();
    }

    window.onload = () => {
        renderHistory();
        renderCatalogs();
    };
</script>

</body>
</html>
