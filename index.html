<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVAC Diagnose AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f4f8; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h1, h2 { color: #0275d8; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; }
        select, textarea, input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; height: 80px; }
        button { width: 100%; padding: 15px; background-color: #0275d8; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 16px; transition: background 0.3s; }
        button:hover { background-color: #025aa5; }
        button:disabled { background-color: #a0c4e8; cursor: not-allowed; }
        
        .ai-section { border-top: 2px dashed #ccc; margin-top: 30px; padding-top: 20px; }
        #result { margin-top: 20px; padding: 15px; background: #e9f5ff; border-radius: 8px; display: none; border: 1px solid #bce0fd; white-space: pre-wrap; line-height: 1.6; }
        .cause-item { background: white; padding: 10px; margin-bottom: 10px; border-right: 4px solid #0275d8; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .prob { color: #d9534f; font-weight: bold; }
        .loading { text-align: center; color: #0275d8; font-weight: bold; display: none; margin-top: 15px; }
        
        .history-section { border-top: 2px solid #0275d8; margin-top: 40px; padding-top: 20px; }
        .history-item { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 8px; font-size: 14px; position: relative;}
        .history-date { color: #888; font-size: 12px; margin-bottom: 5px; }
        .history-text { font-weight: bold; color: #333; margin-bottom: 5px; padding-left: 25px;}
        .history-result { color: #555; font-size: 13px; background: white; padding: 8px; border-radius: 4px; max-height: 120px; overflow-y: auto; }
        .delete-btn { position: absolute; top: 10px; left: 10px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-weight: bold; padding: 0; line-height: 1; }
        .delete-btn:hover { background: #cc0000; }
        .clear-btn { background-color: #d9534f; margin-top: 10px; padding: 10px; font-size: 14px; }
        .clear-btn:hover { background-color: #c9302c; }
        .search-btn { background-color: #5cb85c; }
        .search-btn:hover { background-color: #4cae4c; }
        .save-btn { background-color: #f0ad4e; margin-top: 10px; font-size: 14px;}
        .save-btn:hover { background-color: #ec971f; }
        
        .catalog-section { background-color: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-top: 30px; }
        .catalog-section h3 { color: #856404; margin-top: 0; text-align: center;}
        .catalog-list { margin-top: 15px; }
        .catalog-item { background: white; padding: 10px; border-radius: 5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
        .catalog-item a { color: #0275d8; text-decoration: none; font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h1>❄ HVAC Diagnose AI</h1>
    <p class="subtitle">مساعدك الذكي لتشخيص أعطال التكييف والتبريد</p>

    <label for="manualSearchText">🔎 اكتب العطل بكلماتك الخاصة:</label>
    <input type="text" id="manualSearchText" placeholder="مثال: المكيف يقطر ماء...">
    <button class="search-btn" onclick="unifiedSearch()">بحث وتشخيص ذكي</button>

    <div class="ai-section" style="border-top: 1px dashed #ccc; margin-top: 20px; padding-top: 15px;">
        <label>أو اختر من القائمة المنسدلة:</label>
        <select id="deviceType" onchange="updateSymptoms()">
            <option value="split">مكيف سبليت</option>
            <option value="coldroom">غرفة تبريد</option>
        </select>
        <select id="symptom" style="margin-top: 10px;"></select>
        <button onclick="runDiagnose()">🔍 تشخيص من القائمة</button>
    </div>

    <div class="ai-section">
        <h2>🤖 التشخيص المتقدم أو قراءة الكتالوج</h2>
        <label for="problemText">اكتب سؤالك (مثال: اشرح لي كود العطل E5 من هذا الكتالوج):</label>
        <textarea id="problemText" placeholder="اكتب العطل أو سؤالك عن الكتالوج هنا..."></textarea>
        
        <label for="imageInput">أرفق صورة للعطل أو ملف الكتالوج (PDF):</label>
        <input type="file" id="imageInput" accept="image/*,application/pdf">
        
        <button id="aiBtn" onclick="diagnoseWithAI()">✨ إرسال للذكاء الاصطناعي</button>
        <div id="loading" class="loading">جاري قراءة الملف والتحليل... ⏳</div>
    </div>

    <div id="result"></div>

    <div class="catalog-section">
        <h3>📖 مكتبة الكتالوجات (الروابط)</h3>
        <label for="catalogName">اسم الكتالوج/الجهاز:</label>
        <input type="text" id="catalogName" placeholder="مثال: كتالوج مكيف LG">
        <label for="catalogLink">رابط الكتالوج (URL):</label>
        <input type="text" id="catalogLink" placeholder="https://...">
        <button class="save-btn" onclick="saveCatalogLink()">💾 حفظ الرابط</button>
        
        <div id="catalogList" class="catalog-list"></div>
    </div>

    <div class="history-section">
        <h2>📚 سجل التشخيصات</h2>
        <div id="historyList"></div>
        <button class="clear-btn" onclick="clearHistory()">🗑️ مسح السجل بالكامل</button>
    </div>
</div>

<script>
    let diagnoseDB = JSON.parse(localStorage.getItem("hvacDB")) || {
        split: {
            not_cooling: { label: "لا يبرد", causes: [{ name: "نقص غاز التبريد", prob: "40%", checks: ["قياس الضغط", "فحص التسربات"] }, { name: "فلتر مسدود", prob: "30%", checks: ["فحص الفلتر"] }] },
            high_pressure: { label: "ضغط مرتفع", causes: [{ name: "مكثف متسخ", prob: "50%", checks: ["تنظيف المكثف"] }, { name: "مروحة المكثف لا تعمل", prob: "30%", checks: ["فحص المروحة"] }] }
        },
        coldroom: {
            not_cooling: { label: "لا يبرد", causes: [{ name: "تسرب غاز", prob: "35%", checks: ["فحص التسربات"] }, { name: "تراكم ثلج", prob: "25%", checks: ["فحص إذابة الثلج"] }] }
        }
    };

    const keywordMap = [
        { device: "split", symptom: "not_cooling", words: ["لا يبرد", "حار", "هواء ساخن", "بارد"] },
        { device: "split", symptom: "high_pressure", words: ["ضغط عالي", "ضغط مرتفع"] }
    ];

    function unifiedSearch() {
        const query = document.getElementById("manualSearchText").value.trim();
        if (!query) { alert("اكتب العطل للبحث."); return; }

        let foundMatch = null;
        for (let item of keywordMap) {
            if (item.words.some(w => query.includes(w))) { foundMatch = item; break; }
        }

        if (foundMatch) {
            showResults(foundMatch.device, foundMatch.symptom);
        } else {
            document.getElementById("problemText").value = query; 
            diagnoseWithAI(); 
        }
    }

    function updateSymptoms() {
        const device = document.getElementById("deviceType").value;
        const symptomSelect = document.getElementById("symptom");
        symptomSelect.innerHTML = "";
        for (let key in diagnoseDB[device]) {
            let option = document.createElement("option");
            option.value = key;
            option.text = diagnoseDB[device][key].label;
            symptomSelect.appendChild(option);
        }
    }

    function runDiagnose() {
        showResults(document.getElementById("deviceType").value, document.getElementById("symptom").value);
    }

    function showResults(device, symptom) {
        const resultDiv = document.getElementById("result");
        const data = diagnoseDB[device][symptom];
        if (!data) return;

        let html = `<h3>النتائج: ${data.label}</h3>`;
        let textToSave = `نوع العطل: ${data.label}\n`;
        data.causes.forEach(c => {
            html += `<div class="cause-item"><strong>${c.name}</strong> <span class="prob">(${c.prob})</span><ul>${c.checks.map(ch => `<li>${ch}</li>`).join("")}</ul></div>`;
            textToSave += `- ${c.name} (${c.prob})\n`;
        });
        resultDiv.innerHTML = html;
        resultDiv.style.display = "block";
        saveToHistory("تشخيص محلي: " + data.label, textToSave);
    }

    async function diagnoseWithAI() {
        const promptText = document.getElementById("problemText").value;
        const fileInput = document.getElementById("imageInput");
        const resultDiv = document.getElementById("result");
        const btn = document.getElementById("aiBtn");
        const loading = document.getElementById("loading");

        if (!promptText && !fileInput.files[0]) {
            alert("الرجاء كتابة سؤال أو إرفاق صورة/كتالوج.");
            return;
        }

        btn.disabled = true;
        loading.style.display = "block";
        resultDiv.style.display = "none";

        let fileData = null;
        let fileMimeType = null;

        if (fileInput.files[0]) {
            const file = fileInput.files[0];
            fileMimeType = file.type;

            if (file.type === "application/pdf") {
                fileData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            } else {
                fileData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_SIZE = 800; 
                            let width = img.width, height = img.height;
                            if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
                            else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
                fileMimeType = "image/jpeg"; 
            }
        }

        const fullPrompt = `أنت خبير في هندسة التبريد والتكييف. سؤال المستخدم: "${promptText}". 
        إذا أرفق المستخدم كتالوج أو صورة، ابحث فيها عن إجابة دقيقة لسؤاله. 
        أجب باللغة العربية بأسلوب فني واضح ومختصر.`;

        try {
            const apiEndpoint = "/api/diagnose"; 
            const response = await fetch(apiEndpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: fullPrompt, fileData: fileData, mimeType: fileMimeType })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error);

            let formattedResult = data.result.replace(/\n/g, '<br>');
            
            resultDiv.innerHTML = `
                <h3>🤖 رد الذكاء الاصطناعي:</h3>
                <p>${formattedResult}</p>
            `;
            resultDiv.style.display = "block";
            saveToHistory("ذكاء اصطناعي: " + (promptText || "تحليل ملف"), data.result);

        } catch (error) {
            resultDiv.innerHTML = `<p style="color:red;">حدث خطأ: ${error.message}</p>`;
            resultDiv.style.display = "block";
        } finally {
            btn.disabled = false;
            loading.style.display = "none";
        }
    }

    function saveCatalogLink() {
        const name = document.getElementById("catalogName").value.trim();
        const link = document.getElementById("catalogLink").value.trim();
        if (!name || !link) { alert("الرجاء كتابة الاسم والرابط."); return; }

        let catalogs = JSON.parse(localStorage.getItem("hvacCatalogs")) || [];
        catalogs.push({ name: name, link: link });
        localStorage.setItem("hvacCatalogs", JSON.stringify(catalogs));
        
        document.getElementById("catalogName").value = "";
        document.getElementById("catalogLink").value = "";
        renderCatalogs();
    }

    function renderCatalogs() {
        const catalogList = document.getElementById("catalogList");
        let catalogs = JSON.parse(localStorage.getItem("hvacCatalogs")) || [];
        
        if (catalogs.length === 0) {
            catalogList.innerHTML = "<p style='text-align:center; font-size:12px; color:#888;'>لا توجد كتالوجات محفوظة.</p>";
            return;
        }

        let html = "";
        catalogs.forEach((item, index) => {
            html += `
            <div class="catalog-item">
                <a href="${item.link}" target="_blank">📄 ${item.name}</a>
                <button class="delete-btn" style="position:static; border-radius:5px;" onclick="deleteCatalog(${index})">×</button>
            </div>`;
        });
        catalogList.innerHTML = html;
    }

    function deleteCatalog(index) {
        let catalogs = JSON.parse(localStorage.getItem("hvacCatalogs")) || [];
        catalogs.splice(index, 1);
        localStorage.setItem("hvacCatalogs", JSON.stringify(catalogs));
        renderCatalogs();
    }

    function saveToHistory(title, resultText) {
        let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
        const newRecord = { id: Date.now(), date: new Date().toLocaleString('ar-EG'), title: title, result: resultText };
        history.unshift(newRecord); 
        if (history.length > 50) history = history.slice(0, 50); 
        localStorage.setItem("hvacHistory", JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const historyList = document.getElementById("historyList");
        let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
        if (history.length === 0) {
            historyList.innerHTML = "<p style='text-align:center; color:#888;'>لا توجد أعطال محفوظة.</p>";
            return;
        }
        let html = "";
        history.forEach(item => {
            html += `
            <div class="history-item">
                <button class="delete-btn" onclick="deleteHistory(${item.id})">×</button>
                <div class="history-date">🕒 ${item.date}</div>
                <div class="history-text">${item.title}</div>
                <div class="history-result">${item.result.replace(/\n/g, '<br>')}</div>
            </div>`;
        });
        historyList.innerHTML = html;
    }

    function deleteHistory(id) {
        if (confirm("حذف هذا العطل؟")) {
            let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
            history = history.filter(item => item.id !== id);
            localStorage.setItem("hvacHistory", JSON.stringify(history));
            renderHistory();
        }
    }

    function clearHistory() {
        if (confirm("مسح كل السجل؟")) {
            localStorage.removeItem("hvacHistory");
            renderHistory();
        }
    }

    window.onload = () => {
        updateSymptoms();
        renderHistory();
        renderCatalogs();
    };
</script>

</body>
</html>
