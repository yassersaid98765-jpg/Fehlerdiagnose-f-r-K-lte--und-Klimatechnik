<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVAC Diagnose AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f4f8; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h1, h2 { color: #0275d8; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; }
        select, textarea, input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; height: 80px; }
        button { width: 100%; padding: 15px; background-color: #0275d8; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 16px; transition: background 0.3s; }
        button:hover { background-color: #025aa5; }
        button:disabled { background-color: #a0c4e8; cursor: not-allowed; }
        
        .ai-section { border-top: 2px dashed #ccc; margin-top: 30px; padding-top: 20px; }
        #result { margin-top: 20px; padding: 15px; background: #e9f5ff; border-radius: 8px; display: none; border: 1px solid #bce0fd; white-space: pre-wrap; line-height: 1.6; }
        .cause-item { background: white; padding: 10px; margin-bottom: 10px; border-right: 4px solid #0275d8; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .prob { color: #d9534f; font-weight: bold; }
        .loading { text-align: center; color: #0275d8; font-weight: bold; display: none; margin-top: 15px; }
        
        .history-section { border-top: 2px solid #0275d8; margin-top: 40px; padding-top: 20px; }
        .history-item { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 8px; font-size: 14px; position: relative;}
        .history-date { color: #888; font-size: 12px; margin-bottom: 5px; }
        .history-text { font-weight: bold; color: #333; margin-bottom: 5px; padding-left: 25px;}
        .history-result { color: #555; font-size: 13px; background: white; padding: 8px; border-radius: 4px; max-height: 120px; overflow-y: auto; }
        .delete-btn { position: absolute; top: 10px; left: 10px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-weight: bold; padding: 0; line-height: 1; }
        .delete-btn:hover { background: #cc0000; }
        .clear-btn { background-color: #d9534f; margin-top: 10px; padding: 10px; font-size: 14px; }
        .clear-btn:hover { background-color: #c9302c; }
        .search-btn { background-color: #5cb85c; }
        .search-btn:hover { background-color: #4cae4c; }
        .save-btn { background-color: #f0ad4e; margin-top: 10px; font-size: 14px;}
        .save-btn:hover { background-color: #ec971f; }
    </style>
</head>
<body>

<div class="container">
    <h1>❄ HVAC Diagnose AI</h1>
    <p class="subtitle">مساعدك الذكي لتشخيص أعطال التكييف والتبريد</p>

    <!-- قسم البحث الموحد -->
    <label for="manualSearchText">🔎 اكتب العطل بكلماتك الخاصة:</label>
    <input type="text" id="manualSearchText" placeholder="مثال: المكيف يقطر ماء، أو الضاغط لا يعمل...">
    <button class="search-btn" onclick="unifiedSearch()">بحث وتشخيص ذكي</button>

    <div class="ai-section" style="border-top: 1px dashed #ccc; margin-top: 20px; padding-top: 15px;">
        <label>أو اختر من القائمة المنسدلة:</label>
        <select id="deviceType" onchange="updateSymptoms()">
            <option value="split">مكيف سبليت / Split-Klimaanlage</option>
            <option value="coldroom">غرفة تبريد / Kühlraum</option>
        </select>

        <select id="symptom" style="margin-top: 10px;"></select>
        <button onclick="runDiagnose()">🔍 تشخيص من القائمة</button>
    </div>

    <!-- قسم الذكاء الاصطناعي -->
    <div class="ai-section">
        <h2>🤖 التشخيص المتقدم (ذكاء اصطناعي)</h2>
        <label for="problemText">اكتب تفاصيل دقيقة أو أرفق صورة:</label>
        <textarea id="problemText" placeholder="مثال: المكيف يعمل ولكن لا يخرج هواء بارد..."></textarea>
        <label for="imageInput">أو أرفق صورة للعطل (اختياري):</label>
        <input type="file" id="imageInput" accept="image/*" capture="environment">
        <button id="aiBtn" onclick="diagnoseWithAI()">✨ اطلب التشخيص من الذكاء الاصطناعي</button>
        <div id="loading" class="loading">جاري تحليل الصورة والنص... الرجاء الانتظار ⏳</div>
    </div>

    <!-- مكان عرض النتائج -->
    <div id="result"></div>

    <!-- قسم مكتبة الأعطال (السجل) -->
    <div class="history-section">
        <h2>📚 مكتبة الأعطال (السجل)</h2>
        <div id="historyList"></div>
        <button class="clear-btn" onclick="clearHistory()">🗑️ مسح السجل بالكامل</button>
    </div>
</div>

<script>
    // --- قاعدة البيانات اليدوية الموسعة ---
    let diagnoseDB = JSON.parse(localStorage.getItem("hvacDB")) || {
        split: {
            not_cooling: { label: "لا يبرد", causes: [{ name: "نقص غاز التبريد", prob: "40%", checks: ["قياس الضغط", "فحص التسربات"] }, { name: "فلتر مسدود", prob: "30%", checks: ["فحص الفلتر"] }, { name: "عطل في الضاغط", prob: "20%", checks: ["قياس تيار الضاغط"] }, { name: "عطل في المروحة الخارجية", prob: "10%", checks: ["فحص دوران المروحة"] }] },
            high_pressure: { label: "ضغط مرتفع", causes: [{ name: "مكثف متسخ", prob: "50%", checks: ["تنظيف المكثف"] }, { name: "مروحة المكثف لا تعمل", prob: "30%", checks: ["فحص المروحة"] }, { name: "شحن زائد للغاز", prob: "20%", checks: ["قياس الضغط"] }] },
            low_pressure: { label: "ضغط منخفض", causes: [{ name: "تسريب غاز", prob: "60%", checks: ["فحص مفاصل النحاس"] }, { name: "انسداد في الفلتر", prob: "40%", checks: ["فحص الفلتر"] }] },
            water_leak: { label: "تسريب ماء", causes: [{ name: "انسداد في خرطوم التصريف", prob: "50%", checks: ["نفخ الخرطوم"] }, { name: "تجمد المبخر", prob: "30%", checks: ["فحص الفلتر"] }, { name: "ميل الوحدة غير صحيح", prob: "20%", checks: ["تعديل الميل"] }] },
            noise: { label: "صوت عالي", causes: [{ name: "اهتزاز في الوحدة", prob: "40%", checks: ["فحص القواعد"] }, { name: "تلف في بلوفير المروحة", prob: "30%", checks: ["فحص المروحة"] }, { name: "احتكاك المروحة", prob: "30%", checks: ["فحص المروحة"] }] }
        },
        coldroom: {
            not_cooling: { label: "لا يبرد", causes: [{ name: "تسرب غاز", prob: "35%", checks: ["فحص التسربات"] }, { name: "تراكم ثلج على المبخر", prob: "25%", checks: ["فحص إذابة الثلج"] }, { name: "عطل في منظم الحرارة", prob: "20%", checks: ["فحص الحساس"] }, { name: "باب الغرفة غير محكم", prob: "20%", checks: ["فحص المطاط"] }] },
            ice_buildup: { label: "تراكم ثلج", causes: [{ name: "عطل في مؤقت إذابة الثلج", prob: "40%", checks: ["فحص المؤقت"] }, { name: "عطل في سخانات إذابة الثلج", prob: "30%", checks: ["قياس السخانات"] }, { name: "عطل في حساس الحرارة", prob: "30%", checks: ["فحص الحساس"] }] },
            compressor_off: { label: "الضاغط لا يعمل", causes: [{ name: "فصل أوفرلود الحماية", prob: "40%", checks: ["انتظار 30 دقيقة"] }, { name: "عطل في الكونتاكتور", prob: "40%", checks: ["فحص الكونتاكتور"] }, { name: "انخفاض الجهد", prob: "20%", checks: ["قياس الفولت"] }] }
        }
    };

    // خريطة الكلمات المفتاحية للبحث المحلي
    const keywordMap = [
        { device: "split", symptom: "water_leak", words: ["ماء", "تسريب", "قطرات", "يقطر", "تنقيط", "ماء من المكيف"] },
        { device: "split", symptom: "noise", words: ["صوت", "ضجيج", "اهتزاز", "طقطقة", "صوت عالي"] },
        { device: "split", symptom: "high_pressure", words: ["ضغط عالي", "ضغط مرتفع"] },
        { device: "split", symptom: "low_pressure", words: ["ضغط منخفض", "ضغط ضعيف"] },
        { device: "split", symptom: "not_cooling", words: ["لا يبرد", "حار", "هواء ساخن", "بارد"] },
        { device: "coldroom", symptom: "ice_buildup", words: ["ثلج", "تجميد", "جليد"] },
        { device: "coldroom", symptom: "compressor_off", words: ["الضاغط لا يعمل", "الكمبرسور لا يعمل", "مطفي"] },
        { device: "coldroom", symptom: "not_cooling", words: ["لا يبرد", "حار", "بارد"] }
    ];

    // --- دالة البحث الموحدة (محلي + ذكاء اصطناعي) ---
    function unifiedSearch() {
        const query = document.getElementById("manualSearchText").value.trim();
        if (!query) { alert("الرجاء كتابة العطل للبحث عنه."); return; }

        let foundMatch = null;
        for (let i = 0; i < keywordMap.length; i++) {
            const item = keywordMap[i];
            for (let j = 0; j < item.words.length; j++) {
                if (query.includes(item.words[j])) {
                    foundMatch = item; break;
                }
            }
            if (foundMatch) break;
        }

        if (foundMatch) {
            showResults(foundMatch.device, foundMatch.symptom);
        } else {
            // إذا لم يجده محلياً، يرسله تلقائياً للذكاء الاصطناعي
            document.getElementById("problemText").value = query; 
            diagnoseWithAI(); 
        }
    }

    function updateSymptoms() {
        const device = document.getElementById("deviceType").value;
        const symptomSelect = document.getElementById("symptom");
        symptomSelect.innerHTML = "";
        const symptoms = diagnoseDB[device];
        for (let key in symptoms) {
            let option = document.createElement("option");
            option.value = key;
            option.text = symptoms[key].label;
            symptomSelect.appendChild(option);
        }
    }

    function runDiagnose() {
        const device = document.getElementById("deviceType").value;
        const symptom = document.getElementById("symptom").value;
        showResults(device, symptom);
    }

    function showResults(device, symptom) {
        const resultDiv = document.getElementById("result");
        const data = diagnoseDB[device][symptom];
        if (!data) return;

        let html = `<h3>النتائج المحلية: ${data.label}</h3>`;
        let textToSave = `نوع العطل: ${data.label}\n`;
        
        data.causes.forEach(c => {
            html += `<div class="cause-item"><strong>${c.name}</strong> <span class="prob">(${c.prob})</span><ul>${c.checks.map(ch => `<li>${ch}</li>`).join("")}</ul></div>`;
            textToSave += `- ${c.name} (${c.prob})\n`;
        });
        
        resultDiv.innerHTML = html;
        resultDiv.style.display = "block";
        saveToHistory("تشخيص محلي: " + data.label, textToSave);
    }

    async function diagnoseWithAI() {
        const promptText = document.getElementById("problemText").value;
        const fileInput = document.getElementById("imageInput");
        const resultDiv = document.getElementById("result");
        const btn = document.getElementById("aiBtn");
        const loading = document.getElementById("loading");

        if (!promptText && !fileInput.files[0]) {
            alert("الرجاء كتابة وصف العطل أو إرفاق صورة أولاً.");
            return;
        }

        btn.disabled = true;
        loading.style.display = "block";
        resultDiv.style.display = "none";

        let base64Image = null;
        if (fileInput.files[0]) {
            const file = fileInput.files[0];
            base64Image = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 800; 
                        let width = img.width, height = img.height;
                        if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
                        else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7).split(',')[1]);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        const fullPrompt = `أنت خبير في هندسة التبريد والتكييف. المستخدم يصف المشكلة التالية: "${promptText}". 
        قم بتحليل المشكلة بناءً على الوصف والصورة (إن وجدت). 
        أعطني: 1. الأسباب المحتملة مرتبة. 2. خطوات الفحص المطلوبة. 3. تحذيرات السلامة. 
        أجب باللغة العربية بأسلوب فني واضح ومختصر.`;

        try {
            const apiEndpoint = "/api/diagnose"; 
            const response = await fetch(apiEndpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: fullPrompt, imageData: base64Image })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error);

            let formattedResult = data.result.replace(/\n/g, '<br>');
            
            // إضافة زر لحفظ هذا العطل في المكتبة المحلية
            resultDiv.innerHTML = `
                <h3>🤖 تحليل الذكاء الاصطناعي:</h3>
                <p>${formattedResult}</p>
                <button class="save-btn" onclick="addToLocalDB('${promptText.replace(/'/g, "\\'")}', '${data.result.replace(/'/g, "\\'").replace(/\n/g, "\\n")}')">
                    💾 حفظ هذا العطل في المكتبة الداخلية
                </button>
            `;
            resultDiv.style.display = "block";
            saveToHistory("ذكاء اصطناعي: " + promptText, data.result);

        } catch (error) {
            resultDiv.innerHTML = `<p style="color:red;">حدث خطأ: ${error.message}</p>`;
            resultDiv.style.display = "block";
        } finally {
            btn.disabled = false;
            loading.style.display = "none";
        }
    }

    // --- دالة حفظ عطل جديد للمكتبة الداخلية (التدريب) ---
    function addToLocalDB(queryText, aiResult) {
        if (!diagnoseDB.split.custom) diagnoseDB.split.custom = {};
        
        const newKey = "custom_" + Date.now();
        
        // إضافة العطل للقائمة المنسدلة
        diagnoseDB.split.custom[newKey] = {
            label: queryText,
            causes: [{ name: aiResult, prob: "100%", checks: ["تم التشخيص بواسطة الذكاء الاصطناعي"] }]
        };

        // إضافة الكلمات للبحث المحلي
        keywordMap.push({ device: "split", symptom: newKey, words: queryText.split(" ") });

        // حفظ في ذاكرة المتصفح
        localStorage.setItem("hvacDB", JSON.stringify(diagnoseDB));
        
        updateSymptoms();
        alert("تم حفظ العطل بنجاح في المكتبة! يمكنك الآن اختياره من القائمة أو البحث عنه.");
    }

    // --- إدارة السجل ---
    function saveToHistory(title, resultText) {
        let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
        const newRecord = { id: Date.now(), date: new Date().toLocaleString('ar-EG'), title: title, result: resultText };
        history.unshift(newRecord); 
        if (history.length > 50) history = history.slice(0, 50); 
        localStorage.setItem("hvacHistory", JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const historyList = document.getElementById("historyList");
        let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
        if (history.length === 0) {
            historyList.innerHTML = "<p style='text-align:center; color:#888;'>لا توجد أعطال محفوظة حتى الآن.</p>";
            return;
        }
        let html = "";
        history.forEach(item => {
            html += `
            <div class="history-item">
                <button class="delete-btn" onclick="deleteHistory(${item.id})" title="حذف">×</button>
                <div class="history-date">🕒 ${item.date}</div>
                <div class="history-text">${item.title}</div>
                <div class="history-result">${item.result.replace(/\n/g, '<br>')}</div>
            </div>`;
        });
        historyList.innerHTML = html;
    }

    function deleteHistory(id) {
        if (confirm("هل تريد حذف هذا العطل من السجل؟")) {
            let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
            history = history.filter(item => item.id !== id);
            localStorage.setItem("hvacHistory", JSON.stringify(history));
            renderHistory();
        }
    }

    function clearHistory() {
        if (confirm("هل أنت متأكد من مسح كل سجل الأعطال؟")) {
            localStorage.removeItem("hvacHistory");
            renderHistory();
        }
    }

    window.onload = () => {
        updateSymptoms();
        renderHistory();
    };
</script>

</body>
</html>
