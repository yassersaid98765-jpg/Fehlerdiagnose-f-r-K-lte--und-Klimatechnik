<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVAC Diagnose Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f4f8; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #0275d8; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; }
        select, input[type="text"], input[type="number"], input[type="file"], textarea { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; height: 80px; }
        button { width: 100%; padding: 15px; background-color: #0275d8; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 16px; transition: background 0.3s; }
        button:hover { background-color: #025aa5; }
        
        /* شريط المزامنة */
        .sync-bar { background-color: #d4edda; color: #155724; text-align: center; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; display: none; border: 1px solid #c3e6cb;}
        
        .search-section { background-color: #e8f4fd; padding: 15px; border-radius: 8px; border: 1px solid #bce0fd; }
        .search-btn { background-color: #5cb85c; }
        .search-btn:hover { background-color: #4cae4c; }
        .google-btn { background-color: #4285f4; margin-top: 10px; }
        .google-btn:hover { background-color: #3367d6; }
        
        #result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; display: none; border: 1px solid #ddd; line-height: 1.6; }
        .cause-item { background: white; padding: 10px; margin-bottom: 10px; border-right: 4px solid #0275d8; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative;}
        .prob { color: #d9534f; font-weight: bold; }
        
        .add-fault-section { background-color: #e6f4ea; border: 2px dashed #34a853; padding: 15px; border-radius: 8px; margin-top: 30px; }
        .add-fault-section h3 { color: #1e8e3e; margin-top: 0; text-align: center;}
        .add-btn { background-color: #34a853; }
        .add-btn:hover { background-color: #2b8a44; }

        .history-section { border-top: 2px solid #0275d8; margin-top: 30px; padding-top: 20px; }
        .history-item { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 8px; font-size: 14px; position: relative;}
        .history-date { color: #888; font-size: 12px; margin-bottom: 5px; }
        .history-text { font-weight: bold; color: #333; margin-bottom: 5px; padding-left: 25px;}
        .history-result { color: #555; font-size: 13px; background: white; padding: 8px; border-radius: 4px; max-height: 120px; overflow-y: auto; }
        .delete-btn { position: absolute; top: 10px; left: 10px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-weight: bold; padding: 0; line-height: 1; }
        .clear-btn { background-color: #d9534f; margin-top: 10px; padding: 10px; font-size: 14px; }
        
        .catalog-section { background-color: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .catalog-section h3 { color: #856404; margin-top: 0; text-align: center;}
        .catalog-item { background: white; padding: 10px; border-radius: 5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
        .catalog-item a { color: #0275d8; text-decoration: none; font-weight: bold; word-break: break-all; }
        .save-btn { background-color: #f0ad4e; margin-top: 10px; font-size: 14px;}
        .save-btn:hover { background-color: #ec971f; }
        
        .local-catalog-section { background-color: #e2e3e5; border: 1px solid #d6d8db; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .local-catalog-section h3 { color: #383d41; margin-top: 0; text-align: center; font-size: 16px;}
        
        #pdfViewerContainer { display: none; margin-top: 15px; border: 2px solid #0275d8; border-radius: 8px; overflow: hidden; background: #525659; }
        .pdf-controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px; border-bottom: 1px solid #ddd; gap: 5px;}
        .pdf-controls button { width: auto; margin: 0; padding: 8px 12px; font-size: 12px; background-color: #0275d8;}
        .pdf-controls input { width: 60px; padding: 5px; margin: 0; text-align: center; font-size: 14px;}
        .pdf-controls span { font-weight: bold; color: #333; font-size: 14px;}
        #canvasContainer { width: 100%; text-align: center; padding: 10px 0; max-height: 500px; overflow: auto; }
        canvas { max-width: none; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: transform 0.2s; }
        
        .zoom-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; background: #eee; padding: 8px; border-bottom: 1px solid #ddd; }
        .zoom-controls button { background-color: #6c757d; margin: 0; padding: 5px 15px; font-size: 14px;}
        .external-btn { background-color: #28a745 !important; }
        .translate-ai-btn { background-color: #8e44ad !important; }
        .translate-free-btn { background-color: #f39c12 !important; }
        
        #translationBox { display: none; background: #fff3cd; border: 2px solid #f0ad4e; padding: 15px; margin-top: 15px; border-radius: 8px; color: #333; line-height: 1.6; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>❄ HVAC Diagnose Tool</h1>
    <p class="subtitle">مرجعك الميداني السريع (مزامنة سحابية)</p>

    <!-- شريط حالة المزامنة -->
    <div id="syncStatus" class="sync-bar">☁️ جاري المزامنة مع السحابة...</div>

    <div class="search-section">
        <label for="manualSearchText">🔎 اكتب العطل بكلماتك الخاصة:</label>
        <input type="text" id="manualSearchText" placeholder="مثال: الكهرباء تفصل...">
        <button class="search-btn" onclick="unifiedSearch()">البحث في المكتبة الداخلية</button>
        <button class="google-btn" onclick="searchGoogle()">🌐 ابحث عن هذا العطل في جوجل</button>
    </div>

    <div style="border-top: 1px dashed #ccc; margin-top: 20px; padding-top: 15px;">
        <label>أو اختر من القائمة:</label>
        <select id="deviceType" onchange="updateSymptoms()">
            <option value="split">مكيف سبليت / Split</option>
            <option value="coldroom">غرفة تبريد / Cold Room</option>
        </select>
        <select id="symptom" style="margin-top: 10px;"></select>
        <button onclick="runDiagnose()">🔍 تشخيص من القائمة</button>
    </div>

    <div id="result"></div>

    <div class="add-fault-section">
        <h3>➕ إضافة عطل جديد للمكتبة</h3>
        <label>نوع الجهاز:</label>
        <select id="addDeviceType">
            <option value="split">مكيف سبليت</option>
            <option value="coldroom">غرفة تبريد</option>
        </select>
        
        <label>اسم العطل:</label>
        <input type="text" id="newFaultName" placeholder="مثال: تسريب ماء من السقف">
        
        <label>الأسباب وخطوات الفحص (كل سبب في سطر جديد):</label>
        <textarea id="newFaultCauses" placeholder="مثال:&#10;انسداد في خرطوم التصريف - قم بنفخ الخرطوم&#10;تجمد المبخر - قم بتنظيف الفلتر"></textarea>
        
        <button class="add-btn" onclick="addNewFault()">💾 حفظ العطل في المكتبة</button>
    </div>

    <div class="catalog-section">
        <h3>📖 مكتبة الكتالوجات (الروابط)</h3>
        <input type="text" id="catalogName" placeholder="اسم الكتالوج/الجهاز">
        <input type="text" id="catalogLink" placeholder="https://..." style="margin-top:5px;">
        <button class="save-btn" onclick="saveCatalogLink()">💾 حفظ الرابط</button>
        <div id="catalogList" class="catalog-item-list"></div>
    </div>

    <div class="local-catalog-section">
        <h3>📂 فتح كتالوج من ذاكرة الهاتف</h3>
        <input type="file" id="localCatalogInput" accept="application/pdf" onchange="loadLocalPDF()" style="background: white; cursor: pointer;">
        
        <div id="pdfViewerContainer">
            <div class="pdf-controls">
                <div style="display:flex; align-items:center; gap:5px;">
                    <button onclick="changePage(-1)">⬅️</button>
                    <input type="number" id="pageInput" min="1" onchange="goToPage()">
                    <span>من <span id="pageCount">?</span></span>
                </div>
                <button onclick="changePage(1)">➡️</button>
                <button style="background-color:#d9534f;" onclick="closePdfViewer()">× إغلاق</button>
            </div>
            
            <div class="zoom-controls">
                <button onclick="zoomIn()">➕ تكبير</button>
                <button onclick="zoomOut()">➖ تصغير</button>
                <button class="external-btn" onclick="openPdfExternally()">↗️ فتح خارجي</button>
                <button class="translate-free-btn" onclick="translateTextFree()">📄 ترجمة سريعة</button>
                <button class="translate-ai-btn" onclick="translateCurrentPage()">🌐 ترجمة AI</button>
            </div>

            <div id="canvasContainer">
                <canvas id="pdfCanvas"></canvas>
            </div>
        </div>

        <div id="translationBox">
            <h4 style="margin-top:0;">🌐 النص المترجم:</h4>
            <p id="translationText">جاري الترجمة...</p>
        </div>
    </div>

    <div class="history-section">
        <h2>📚 سجل التشخيصات</h2>
        <div id="historyList"></div>
        <button class="clear-btn" onclick="clearHistory()">🗑️ مسح السجل بالكامل</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. دوال المزامنة التلقائية مع السحابة
    // ==========================================
    async function syncToCloud() {
        const syncBar = document.getElementById("syncStatus");
        syncBar.style.display = "block";
        syncBar.textContent = "☁️ جاري الحفظ في السحابة...";
        syncBar.style.backgroundColor = "#fff3cd"; 
        syncBar.style.color = "#856404";

        const dataToSync = {
            customDB: localStorage.getItem("hvacCustomDB"),
            history: localStorage.getItem("hvacHistory"),
            catalogs: localStorage.getItem("hvacCatalogs")
        };

        try {
            await fetch('/api/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataToSync)
            });
            syncBar.textContent = "✅ تم الحفظ في السحابة بنجاح";
            syncBar.style.backgroundColor = "#d4edda"; 
            syncBar.style.color = "#155724";
            setTimeout(() => { syncBar.style.display = "none"; }, 3000); 
        } catch (e) {
            syncBar.textContent = "❌ فشل الاتصال بالسحابة";
            syncBar.style.backgroundColor = "#f8d7da"; 
            syncBar.style.color = "#721c24";
        }
    }

    async function loadFromCloud() {
        try {
            const res = await fetch('/api/sync');
            const cloudData = await res.json();
            
            if (cloudData && cloudData.customDB) {
                localStorage.setItem("hvacCustomDB", cloudData.customDB);
                localStorage.setItem("hvacHistory", cloudData.history || "[]");
                localStorage.setItem("hvacCatalogs", cloudData.catalogs || "[]");
                
                diagnoseDB = JSON.parse(cloudData.customDB);
                updateSymptoms();
                renderHistory();
                renderCatalogs();
                console.log("تم تحميل البيانات من السحابة بنجاح.");
            }
        } catch (e) {
            console.log("لا توجد بيانات سحابية سابقة، سنبدأ من الصفر.");
        }
    }

    // ==========================================
    // 2. قاعدة البيانات والوظائف الأساسية
    // ==========================================
    let defaultDB = {
        split: {
            not_cooling: { label: "لا يبرد (هواء عادي)", causes: [{ name: "نقص غاز التبريد (تسريب)", prob: "40%", checks: ["قياس ضغط السحب", "فحص مفاصل النحاس"] }, { name: "فلتر هواء مسدود", prob: "25%", checks: ["فحص الفلتر"] }, { name: "عطل في الضاغط", prob: "15%", checks: ["قياس تيار الضاغط"] }] },
            high_pressure: { label: "ضغط مرتفع", causes: [{ name: "مكثف متسخ", prob: "50%", checks: ["تنظيف المكثف"] }, { name: "مروحة المكثف لا تعمل", prob: "30%", checks: ["فحص المروحة"] }] },
            water_leak: { label: "تسريب ماء", causes: [{ name: "انسداد في خرطوم التصريف", prob: "50%", checks: ["نفخ الخرطوم"] }, { name: "تجمد المبخر", prob: "30%", checks: ["فحص الفلتر"] }] }
        },
        coldroom: {
            not_cooling: { label: "لا يبرد", causes: [{ name: "تسرب غاز", prob: "35%", checks: ["فحص التسربات"] }, { name: "تراكم ثلج", prob: "25%", checks: ["فحص إذابة الثلج"] }] }
        }
    };

    let diagnoseDB = JSON.parse(localStorage.getItem("hvacCustomDB")) || defaultDB;
    let keywordMap = [
        { device: "split", symptom: "water_leak", words: ["ماء", "تسريب", "يقطر"] },
        { device: "split", symptom: "high_pressure", words: ["ضغط عالي", "ضغط مرتفع"] },
        { device: "split", symptom: "not_cooling", words: ["لا يبرد", "حار", "بارد"] },
        { device: "coldroom", symptom: "not_cooling", words: ["لا يبرد", "حار"] }
    ];

    function addNewFault() {
        const device = document.getElementById("addDeviceType").value;
        const faultName = document.getElementById("newFaultName").value.trim();
        const causesText = document.getElementById("newFaultCauses").value.trim();

        if (!faultName || !causesText) { alert("الرجاء كتابة اسم العطل والأسباب."); return; }

        const newKey = "custom_" + Date.now();
        const causesArray = causesText.split('\n').filter(line => line.trim() !== "").map(line => {
            const parts = line.split('-');
            return { name: parts[0].trim(), prob: "جديد", checks: parts.length > 1 ? [parts[1].trim()] : ["فحص يدوي"] };
        });

        if (!diagnoseDB[device]) diagnoseDB[device] = {};
        diagnoseDB[device][newKey] = { label: faultName + " (مخصص)", causes: causesArray };
        keywordMap.push({ device: device, symptom: newKey, words: faultName.split(" ") });

        localStorage.setItem("hvacCustomDB", JSON.stringify(diagnoseDB));
        
        syncToCloud();

        document.getElementById("newFaultName").value = "";
        document.getElementById("newFaultCauses").value = "";
        updateSymptoms();
        alert("✅ تم حفظ العطل بنجاح! (ومزامنته مع السحابة)");
    }

    function saveToHistory(title, resultText) {
        let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
        history.unshift({ id: Date.now(), date: new Date().toLocaleString('ar-EG'), title: title, result: resultText }); 
        if (history.length > 50) history = history.slice(0, 50); 
        localStorage.setItem("hvacHistory", JSON.stringify(history));
        renderHistory();
        syncToCloud(); 
    }

    function deleteHistory(id) { 
        if (confirm("حذف هذا العطل؟")) { 
            let history = JSON.parse(localStorage.getItem("hvacHistory")) || []; 
            history = history.filter(item => item.id !== id); 
            localStorage.setItem("hvacHistory", JSON.stringify(history)); 
            renderHistory(); 
            syncToCloud(); 
        } 
    }
    
    function clearHistory() { 
        if (confirm("مسح كل السجل؟")) { 
            localStorage.removeItem("hvacHistory"); 
            renderHistory(); 
            syncToCloud(); 
        } 
    }

    function saveCatalogLink() {
        const name = document.getElementById("catalogName").value.trim();
        const link = document.getElementById("catalogLink").value.trim();
        if (!name || !link) { alert("الرجاء كتابة الاسم والرابط."); return; }
        let catalogs = JSON.parse(localStorage.getItem("hvacCatalogs")) || [];
        catalogs.push({ name: name, link: link });
        localStorage.setItem("hvacCatalogs", JSON.stringify(catalogs));
        document.getElementById("catalogName").value = ""; document.getElementById("catalogLink").value = "";
        renderCatalogs();
        syncToCloud(); 
    }

    function deleteCatalog(index) {
        let catalogs = JSON.parse(localStorage.getItem("hvacCatalogs")) || [];
        catalogs.splice(index, 1); 
        localStorage.setItem("hvacCatalogs", JSON.stringify(catalogs)); 
        renderCatalogs();
        syncToCloud(); 
    }

    // ==========================================
    // 3. إدارة الكتالوجات، الترجمة، والبحث
    // ==========================================
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    let pdfDoc = null; let pageNum = 1; let pageRendering = false; let pageNumPending = null; let scale = 1.5; let currentPdfBlobUrl = null;

    function loadLocalPDF() {
        const fileInput = document.getElementById("localCatalogInput");
        const file = fileInput.files[0];
        if (!file) return;
        currentPdfBlobUrl = URL.createObjectURL(file);
        document.getElementById("translationBox").style.display = "none";
        const reader = new FileReader();
        reader.onload = function(e) {
            const typedarray = new Uint8Array(e.target.result);
            pdfjsLib.getDocument(typedarray).promise.then(function(pdfDoc_) {
                pdfDoc = pdfDoc_;
                document.getElementById("pageCount").textContent = pdfDoc.numPages;
                document.getElementById("pdfViewerContainer").style.display = "block";
                pageNum = 1; scale = 1.5; renderPage(pageNum);
            }).catch(function(error) { alert("حدث خطأ في قراءة الملف: " + error.message); });
        };
        reader.readAsArrayBuffer(file);
    }

    function renderPage(num) {
        pageRendering = true;
        pdfDoc.getPage(num).then(function(page) {
            const viewport = page.getViewport({scale: scale});
            const canvas = document.getElementById('pdfCanvas');
            const ctx = canvas.getContext('2d');
            canvas.height = viewport.height; canvas.width = viewport.width;
            const renderContext = { canvasContext: ctx, viewport: viewport };
            page.render(renderContext).promise.then(function() {
                pageRendering = false;
                if (pageNumPending !== null) { renderPage(pageNumPending); pageNumPending = null; }
            });
        });
        document.getElementById('pageInput').value = num;
        document.getElementById("translationBox").style.display = "none"; 
    }

    function queueRenderPage(num) { if (pageRendering) { pageNumPending = num; } else { renderPage(num); } }
    function changePage(offset) { if (!pdfDoc) return; const newPage = pageNum + offset; if (newPage >= 1 && newPage <= pdfDoc.numPages) { pageNum = newPage; queueRenderPage(pageNum); } }
    function goToPage() { if (!pdfDoc) return; const inputVal = parseInt(document.getElementById('pageInput').value); if (inputVal >= 1 && inputVal <= pdfDoc.numPages) { pageNum = inputVal; queueRenderPage(pageNum); } else { alert("رقم الصفحة غير صحيح"); document.getElementById('pageInput').value = pageNum; } }
    function zoomIn() { if (!pdfDoc) return; scale += 0.3; queueRenderPage(pageNum); }
    function zoomOut() { if (!pdfDoc || scale <= 0.5) return; scale -= 0.3; queueRenderPage(pageNum); }
    function openPdfExternally() { if (currentPdfBlobUrl) window.open(currentPdfBlobUrl, '_blank'); }
    function closePdfViewer() { document.getElementById("pdfViewerContainer").style.display = "none"; document.getElementById("localCatalogInput").value = ""; document.getElementById("translationBox").style.display = "none"; pdfDoc = null; if (currentPdfBlobUrl) { URL.revokeObjectURL(currentPdfBlobUrl); currentPdfBlobUrl = null; } }

    async function translateTextFree() {
        if (!pdfDoc) return;
        const box = document.getElementById("translationBox"); const txt = document.getElementById("translationText");
        box.style.display = "block"; txt.innerHTML = "⏳ جاري استخراج النص وترجمته..."; txt.style.color = "#0275d8";
        try {
            const textContent = await (await pdfDoc.getPage(pageNum)).getTextContent();
            const text = textContent.items.map(item => item.str).join(" ").trim();
            if (text.length < 5) throw new Error("هذه الصفحة لا تحتوي على نصوص قابلة للنسخ.\nاستخدم 'ترجمة AI' أو 'فتح خارجي'.");
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.substring(0, 500))}&langpair=en|ar`);
            const data = await res.json();
            if (data.responseData && data.responseData.translatedText) { txt.innerHTML = data.responseData.translatedText; txt.style.color = "#333"; } 
            else throw new Error("فشلت الترجمة، يرجى المحاولة لاحقاً.");
        } catch (error) { txt.innerHTML = `<span style="color:red;">${error.message}</span>`; }
    }

    async function translateCurrentPage() {
        if (!pdfDoc) return;
        const box = document.getElementById("translationBox"); const txt = document.getElementById("translationText");
        box.style.display = "block"; txt.innerHTML = "⏳ جاري قراءة الصورة وترجمتها بالذكاء الاصطناعي..."; txt.style.color = "#8e44ad";
        try {
            const imageData = document.getElementById('pdfCanvas').toDataURL('image/jpeg', 0.8).split(',')[1];
            const prompt = `أنت مترجم فني خبير. قم باستخراج جميع النصوص من هذه الصورة وترجمتها إلى اللغة العربية. حافظ على المصطلحات الفنية. أجب بالنص المترجم فقط.`;
            const response = await fetch("/api/diagnose", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: prompt, fileData: imageData, mimeType: "image/jpeg" }) });
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            txt.innerHTML = data.result.replace(/\n/g, '<br>'); txt.style.color = "#333";
        } catch (error) { txt.innerHTML = `<span style="color:red;">حدث خطأ في الترجمة: ${error.message}</span>`; }
    }

    function unifiedSearch() {
        const query = document.getElementById("manualSearchText").value.trim();
        if (!query) { alert("الرجاء كتابة العطل للبحث عنه."); return; }
        let foundMatch = null;
        for (let item of keywordMap) { if (item.words.some(w => query.includes(w))) { foundMatch = item; break; } }
        if (foundMatch) { showResults(foundMatch.device, foundMatch.symptom); } 
        else {
            const resultDiv = document.getElementById("result");
            resultDiv.innerHTML = `<p style="color:#d9534f; font-weight:bold; text-align:center;">لم يتم العثور على العطل في المكتبة الداخلية.<br>يمكنك الضغط على الزر الأزرق (ابحث في جوجل) للبحث عنه في الإنترنت.</p>`;
            resultDiv.style.display = "block";
        }
    }

    function searchGoogle() {
        const query = document.getElementById("manualSearchText").value.trim();
        if (!query) { alert("الرجاء كتابة العطل أولاً لكي تبحث عنه في جوجل."); return; }
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query + " HVAC fault")}`, '_blank');
    }

    function updateSymptoms() {
        const device = document.getElementById("deviceType").value;
        const symptomSelect = document.getElementById("symptom");
        symptomSelect.innerHTML = "";
        for (let key in diagnoseDB[device]) {
            let option = document.createElement("option"); option.value = key; option.text = diagnoseDB[device][key].label; symptomSelect.appendChild(option);
        }
    }

    function runDiagnose() { showResults(document.getElementById("deviceType").value, document.getElementById("symptom").value); }
    
    function showResults(device, symptom) {
        const resultDiv = document.getElementById("result");
        const data = diagnoseDB[device][symptom];
        if (!data) return;
        let html = `<h3>النتائج: ${data.label}</h3>`;
        let textToSave = `نوع العطل: ${data.label}\n`;
        data.causes.forEach(c => {
            html += `<div class="cause-item"><strong>${c.name}</strong> <span class="prob">(${c.prob})</span><ul>${c.checks.map(ch => `<li>${ch}</li>`).join("")}</ul></div>`;
            textToSave += `- ${c.name} (${c.prob})\n`;
        });
        resultDiv.innerHTML = html; resultDiv.style.display = "block";
        saveToHistory("تشخيص: " + data.label, textToSave);
    }

    function renderHistory() {
        const historyList = document.getElementById("historyList");
        let history = JSON.parse(localStorage.getItem("hvacHistory")) || [];
        if (history.length === 0) { historyList.innerHTML = "<p style='text-align:center; color:#888;'>لا توجد أعطال محفوظة.</p>"; return; }
        let html = "";
        history.forEach(item => { html += `<div class="history-item"><button class="delete-btn" onclick="deleteHistory(${item.id})">×</button><div class="history-date">🕒 ${item.date}</div><div class="history-text">${item.title}</div><div class="history-result">${item.result.replace(/\n/g, '<br>')}</div></div>`; });
        historyList.innerHTML = html;
    }

    function renderCatalogs() {
        const catalogList = document.getElementById("catalogList");
        let catalogs = JSON.parse(localStorage.getItem("hvacCatalogs")) || [];
        if (catalogs.length === 0) { catalogList.innerHTML = "<p style='text-align:center; font-size:12px; color:#888;'>لا توجد كتالوجات محفوظة.</p>"; return; }
        let html = "";
        catalogs.forEach((item, index) => { html += `<div class="catalog-item"><a href="${item.link}" target="_blank">📄 ${item.name}</a><button class="delete-btn" style="position:static; border-radius:5px; width:30px; height:30px;" onclick="deleteCatalog(${index})">×</button></div>`; });
        catalogList.innerHTML = html;
    }

    window.onload = () => { 
        updateSymptoms(); 
        renderHistory(); 
        renderCatalogs(); 
        loadFromCloud(); 
    };
</script>
</body>
</html>
