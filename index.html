<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVAC Diagnose</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #0275d8; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #0275d8; color: white; border: none; cursor: pointer; margin-top: 20px; font-weight: bold; }
        button:hover { background-color: #025aa5; }
        #result { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; display: none; }
        .cause-item { background: white; padding: 10px; margin-bottom: 10px; border-right: 4px solid #0275d8; border-radius: 4px; }
        .prob { color: #d9534f; font-weight: bold; }
        ul { padding-right: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>❄ HVAC Diagnose</h1>
    <p style="text-align: center;">Fehlerdiagnose für Kälte- und Klimatechnik</p>

    <label for="deviceType">1. نوع الجهاز / Gerätetyp:</label>
    <select id="deviceType">
        <option value="split">مكيف سبليت / Split-Klimaanlage</option>
        <option value="coldroom">غرفة تبريد / Kühlraum</option>
    </select>

    <label for="symptom">2. وصف العطل / Fehler beschreiben:</label>
    <select id="symptom">
        <option value="not_cooling">لا يبرد / Kühlt nicht</option>
        <option value="high_pressure">ضغط مرتفع / Hoher Druck</option>
    </select>

    <button onclick="runDiagnose()">🔍 تشخيص / Diagnose starten</button>

    <div id="result"></div>
</div>

<script>
    // قاعدة بيانات التشخيص
    const diagnoseDB = {
        split: {
            not_cooling: {
                label: "لا يبرد / Kühlt nicht",
                causes: [
                    { name: "نقص غاز التبريد / Kältemittelmangel", prob: "40%", checks: ["قياس الضغط", "فحص التسربات"] },
                    { name: "فلتر هواء مسدود / Verstopfter Luftfilter", prob: "30%", checks: ["فحص الفلتر", "تنظيف أو استبدال"] },
                    { name: "عطل في الضاغط / Kompressorfehler", prob: "15%", checks: ["قياس تيار الضاغط"] },
                    { name: "عطل في المروحة / Lüfterfehler", prob: "15%", checks: ["فحص دوران المروحة"] }
                ]
            },
            high_pressure: {
                label: "ضغط مرتفع / Hoher Druck",
                causes: [
                    { name: "مكثف متسخ / Verschmutzter Kondensator", prob: "50%", checks: ["تنظيف المكثف", "فحص تدفق الهواء"] },
                    { name: "مروحة المكثف لا تعمل / Kondensatorlüfter defekt", prob: "30%", checks: ["فحص المروحة"] },
                    { name: "شحن زائد للغاز / Überfüllung", prob: "20%", checks: ["قياس الضغط", "فحص الشحن"] }
                ]
            }
        },
        coldroom: {
            not_cooling: {
                label: "لا يبرد / Kühlt nicht",
                causes: [
                    { name: "تسرب غاز / Kältemittelleck", prob: "35%", checks: ["فحص التسربات", "قياس الضغط"] },
                    { name: "عطل في منظم الحرارة / Thermostatfehler", prob: "25%", checks: ["فحص الإعدادات"] },
                    { name: "تراكم ثلج على المبخر / Vereisung", prob: "25%", checks: ["فحص دورة إذابة الثلج"] }
                ]
            }
        }
    };

    function runDiagnose() {
        const device = document.getElementById("deviceType").value;
        const symptom = document.getElementById("symptom").value;
        const resultDiv = document.getElementById("result");

        const data = diagnoseDB[device][symptom];

        if (!data) {
            resultDiv.innerHTML = "<p>عذراً، البيانات غير متوفرة لهذا العطل.</p>";
            resultDiv.style.display = "block";
            return;
        }

        let html = `<h3>النتائج / Ergebnisse: ${data.label}</h3>`;
        
        data.causes.forEach(c => {
            html += `
            <div class="cause-item">
                <strong>${c.name}</strong> <span class="prob">(${c.prob})</span>
                <ul>
                    ${c.checks.map(ch => `<li>${ch}</li>`).join("")}
                </ul>
            </div>`;
        });

        resultDiv.innerHTML = html;
        resultDiv.style.display = "block";
    }
</script>

</body>
</html>
