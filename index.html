.history-text{font-weight:bold;color:#333;margin-bottom:5px;padding-right:25px}
html[dir=ltr] .history-text{padding-right:0;padding-left:25px}
.history-result{color:#555;font-size:13px;background:#fff;padding:8px;border-radius:4px;max-height:120px;overflow-y:auto}
.delete-btn{position:absolute;top:10px;right:10px;background:#ff4d4d;color:#fff;border:none;border-radius:50%;width:25px;height:25px;cursor:pointer;font-weight:bold;padding:0;margin:0}

.clear-btn{background:#d9534f;margin-top:10px;padding:10px;font-size:14px}

.catalog-item a{color:#856404;text-decoration:none;font-weight:bold;word-break:break-all}
.save-btn{background:#f0ad4e;margin-top:10px;font-size:14px}

.pdf-controls input{width:60px;padding:5px;margin:0;text-align:center;font-size:14px}
.pdf-controls span{font-weight:bold;color:#333;font-size:14px}

canvas{max-width:none;box-shadow:0 0 10px rgba(0,0,0,.5)}

.zoom-controls select{width:auto;margin:0;padding:5px;font-size:14px}
.external-btn{background:#28a745!important}
.translate-free-btn{background:#f39c12!important}

.img-buttons{display:flex;gap:10px;margin-top:10px}
.img-buttons button{margin-top:0;flex:1}
.btn-cam{background:#17a2b8}.btn-gal{background:#5a6268}
.img-preview{font-size:12px;color:#28a745;margin-top:5px;display:none;font-weight:bold}

<body>
<div class="container">
<div class="lang-switch"><button class="lang-btn" id="langBtn" type="button">DE</button></div>
<h1 data-i18n="title">❄ HVAC Diagnose Tool</h1>
<p class="subtitle" data-i18n="subtitle"></p>

<details open><summary data-i18n="secCode"></summary><div class="details-content">
<h3 style="color:#e83e8c;font-size:15px;margin-top:0" data-i18n="lblCodeSearch"></h3>

<input type="text" id="searchCode" data-i18n-ph="phCode" style="margin-bottom:5px" autocomplete="off">
<button class="search-code-btn" id="btnSearchCode" type="button" data-i18n="btnSearchCode"></button>
<div id="codeResult"></div>
<hr style="margin:25px 0;border:1px dashed #ccc">
<h3 style="color:#5cb85c;font-size:15px" data-i18n="lblTextSearch"></h3>
<input type="text" id="manualSearchText" data-i18n-ph="phSearch" autocomplete="off">
<button class="search-btn" id="btnSearchLocal" type="button" data-i18n="btnSearchLocal"></button>
<button class="google-btn" id="btnSearchGoogle" type="button" data-i18n="btnSearchGoogle"></button>
<div id="result"></div>
</div></details>

<details><summary data-i18n="secAdd"></summary><div class="details-content">
<h3 style="font-size:16px;border-bottom:1px solid #eee;padding-bottom:5px" data-i18n="lblAddCodeTitle"></h3>

<label data-i18n="lblCode"></label><input type="text" id="newCodeName" placeholder="E5">
<label data-i18n="lblCodeDesc"></label><textarea id="newCodeCauses" data-i18n-ph="phCodeCauses"></textarea>
<button class="add-btn" id="btnAddCode" type="button" data-i18n="btnAddCode"></button>
<hr style="margin:25px 0;border:1px solid #eee">
<h3 style="font-size:16px;border-bottom:1px solid #eee;padding-bottom:5px" data-i18n="lblAddFaultTitle"></h3>
<label data-i18n="lblDevice"></label><select id="addDeviceType">
<option value="split" data-i18n="optSplit"></option>
<option value="coldroom" data-i18n="optCold"></option>
<option value="chiller" data-i18n="optChiller"></option>
<option value="window" data-i18n="optWindow"></option>
</select>
<label data-i18n="lblFaultName"></label><input type="text" id="newFaultName">
<label data-i18n="lblCauses"></label><textarea id="newFaultCauses" data-i18n-ph="phCausesFault"></textarea>
<button class="add-btn" id="btnAddFault" type="button" data-i18n="btnAddFault"></button>
<hr style="margin:25px 0;border:1px solid #eee">
<div class="data-btns">
<button class="export-btn" id="btnExport" type="button" data-i18n="btnExport"></button>
<button class="import-btn" id="btnImport" type="button" data-i18n="btnImport"></button>
<input type="file" id="importFaultsInput" accept=".json,application/json">
</div>
<hr style="margin:25px 0;border:1px solid #eee">
<h3 style="color:#d9534f;font-size:16px" data-i18n="lblDelete"></h3>
<div id="customFaultsList"></div>
</div></details>

<details><summary data-i18n="secLens"></summary><div class="details-content">
<p style="font-size:13px;color:#555" data-i18n="lensDesc"></p>
<div class="img-buttons">
<button type="button" class="btn-cam" id="btnCam" data-i18n="btnCam"></button>
<button type="button" class="btn-gal" id="btnGal" data-i18n="btnGal"></button>
</div>
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="galleryInput" accept="image/*" style="display:none">
<div id="imgPreviewText" class="img-preview" data-i18n="imgPreview"></div>
<button class="google-lens-btn" id="btnLens" type="button" data-i18n="btnLens"></button>
</div></details>

<details><summary data-i18n="secCat"></summary><div class="details-content">
<label data-i18n="lblCatLink"></label>
<input type="text" id="catalogName" data-i18n-ph="phCatName">
<input type="text" id="catalogLink" placeholder="https://..." style="margin-top:5px" dir="ltr">
<button class="save-btn" id="btnSaveCat" type="button" data-i18n="btnSaveCat"></button>
<div id="catalogList" style="margin-top:15px"></div>
<hr style="margin:25px 0;border:1px solid #eee">
<label data-i18n="lblCatFile"></label>
<input type="file" id="localCatalogInput" accept="application/pdf" style="background:#f8f9fa">
<div id="pdfViewerContainer">
<div class="pdf-controls">
<div style="display:flex;align-items:center;gap:5px">
<button type="button" id="btnPrev">⬅️</button>
<input type="number" id="pageInput" min="1">
<span>/ <span id="pageCount">?</span></span>
</div>
<button type="button" id="btnNext">➡️</button>
<button type="button" style="background:#d9534f" id="btnClosePdf" data-i18n="btnClosePdf"></button>
</div>
<div class="zoom-controls">
<button type="button" id="btnZoomIn">➕</button>
<button type="button" id="btnZoomOut">➖</button>
<button type="button" class="external-btn" id="btnExtPdf" data-i18n="btnExtPdf"></button>
<select id="transSrc"><option value="en">EN →</option><option value="de">DE →</option></select>
<button type="button" class="translate-free-btn" id="btnTransPdf" data-i18n="btnTransPdf"></button>
</div>
<div id="canvasContainer"><canvas id="pdfCanvas"></canvas></div>
</div>
<div id="translationBox"><h4 style="margin-top:0" data-i18n="lblTransTitle"></h4><p id="translationText"></p></div>
</div></details>

<details><summary data-i18n="secHist"></summary><div class="details-content">
<div id="historyList"></div>
<button class="clear-btn" id="btnClearHistory" type="button" data-i18n="btnClearHistory"></button>
</div></details>
</div>
<div id="toast"></div>

function findCodes(brandIn,codeIn){const cb=canon(brandIn),cc=canon(codeIn),hits=[],seen=new Set();const scan=(db,custom)=>{for(const b in db){if(cb&&!canon(b).includes(cb))continue;for(const c in db[b]){if(canon(c)!==cc)continue;const key=canon(b)+"|"+canon(c);if(seen.has(key))continue;seen.add(key);const v=db[b][c];hits.push({brand:b,code:c,desc:v.desc||"",causes:Array.isArray(v.causes)?v.causes:[],custom})}};scan(state.codes,true);scan(defaultCodesDB,false);return hits}
function searchErrorCode(){const brandIn=$("searchBrand").value.trim(),codeIn=$("searchCode").value.trim(),out=$("codeResult");if(!codeIn){toast(t("fillCode"),"err");return}const hits=findCodes(brandIn,codeIn);if(hits.length){out.innerHTML=hits.map(h=>`<div class="code-block"><h3>${esc(h.brand)} – ${esc(h.code)} ${h.custom?`<span class="badge">${esc(t("custom"))}</span>`:""}</h3><p class="code-desc">${esc(h.desc)}</p><ul>${h.causes.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`).join("");out.style.display="block";saveToHistory(`${t("codePrefix")}: ${hits[0].brand} ${hits[0].code}`,hits.map(h=>`${h.brand} ${h.code}\n${h.desc}\n${h.causes.join("\n")}`).join("\n\n"))}else{const b=brandIn.toUpperCase(),c=codeIn.toUpperCase();pendingCode={brand:b,code:c};out.innerHTML=`<p style="color:#d9534f;font-weight:bold">${esc(t("codeNotFound"))}</p><button type="button" style="background:#4285f4;margin-bottom:15px" id="btnGoogleCode">${esc(t("btnGoogleCode"))}</button><div style="padding:10px;background:#fff;border:1px solid #ddd;border-radius:8px"><label style="font-size:13px">${esc(t("saveLabel"))}</label><textarea id="foundCodeDesc" style="height:60px;font-size:14px"></textarea><button class="add-btn" type="button" style="margin-top:5px;padding:10px" id="btnSaveFound">${esc(t("saveBtn"))}</button></div>`;out.style.display="block";$("btnGoogleCode").addEventListener("click",()=>window.open("https://www.google.com/search?q="+encodeURIComponent(`${b} ${c} error code HVAC`),"_blank","noopener"));$("btnSaveFound").addEventListener("click",saveCodeFromSearch)}}
function saveCodeFromSearch(){if(!pendingCode)return;if(!pendingCode.brand){toast(t("fillBrandCode"),"err");return}const lines=$("foundCodeDesc").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!lines.length){toast(t("fillDesc"),"err");return}if(!state.codes[pendingCode.brand])state.codes[pendingCode.brand]={};state.codes[pendingCode.brand][pendingCode.code]={desc:lines[0],causes:lines.length>1?lines.slice(1):[]};persist();renderCustomFaults();toast(t("saved"),"ok");searchErrorCode()}

function unifiedSearch(){const query=$("manualSearchText").value.trim();if(!query)return;let tokens=norm(query).split(/[^\p{L}\p{N}]+/u).filter(Boolean);const long=tokens.filter(w=>w.length>=3);if(long.length)tokens=long;const scored=getEntries().map(e=>{const hay=norm(flat(e.data));return{e,score:tokens.filter(w=>hay.includes(w)).length}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5);const out=$("result");if(!scored.length){out.innerHTML=`<p style="color:#d9534f;font-weight:bold;text-align:center">${esc(t("noResults"))}</p>`;out.style.display="block";return}out.innerHTML=scored.map(x=>entryHtml(x.e)).join("");out.style.display="block";saveToHistory(`${t("searchPrefix")}: ${query}`,scored.map(x=>entryText(x.e)).join("\n\n"))}

function addNewFault(){const device=$("addDeviceType").value,name=$("newFaultName").value.trim(),lines=$("newFaultCauses").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!name||!lines.length){toast(t("fillFields"),"err");return}const causes=lines.map(line=>{const i=line.indexOf(" - ");return i>0?{name:line.slice(0,i).trim(),prob:"",checks:[line.slice(i+3).trim()]}:{name:line,prob:"",checks:[]}});if(!isObj(state.faults[device]))state.faults[device]={};state.faults[device]["custom_"+Date.now()]={label:name,causes};persist();renderCustomFaults();$("newFaultName").value="";$("newFaultCauses").value="";toast(t("saved"),"ok")}
function renderCustomFaults(){const list=$("customFaultsList");let html="";for(const b in state.codes)for(const c in state.codes[b])html+=`<div class="custom-fault-item"><span>[${esc(t("codePrefix"))}] ${esc(b)} - ${esc(c)}</span><button type="button" class="mini-del" data-act="delcode" data-brand="${esc(b)}" data-code="${esc(c)}">×</button></div>`;for(const dev in state.faults){if(!isObj(state.faults[dev]))continue;for(const k in state.faults[dev])if(k.indexOf("custom_")===0)html+=`<div class="custom-fault-item"><span>[${esc(devLabel(dev))}] ${esc(tr(state.faults[dev][k].label))}</span><button type="button" class="mini-del" data-act="delfault" data-dev="${esc(dev)}" data-key="${esc(k)}">×</button></div>`}list.innerHTML=html||`<p style="text-align:center;font-size:12px;color:#555;margin:0">${esc(t("noCustom"))}</p>`}
function saveCatalogLink(){const name=$("catalogName").value.trim();let link=$("catalogLink").value.trim();if(!name||!link){toast(t("fillFields"),"err");return}if(!/^[a-z][a-z0-9+.-]*:/i.test(link))link="https://"+link;try{const u=new URL(link);if(u.protocol!=="http:"&&u.protocol!=="https:")throw 0;link=u.href}catch{toast(t("badLink"),"err");return}if(state.catalogs.some(x=>x.link===link)){toast(t("saved"),"ok");return}state.catalogs.push({name,link});persist();renderCatalogs();$("catalogName").value="";$("catalogLink").value=""}
function renderCatalogs(){const box=$("catalogList");if(!state.catalogs.length){box.innerHTML=`<p style="text-align:center;font-size:12px;color:#888">${esc(t("noCatalogs"))}</p>`;return}box.innerHTML=state.catalogs.map((i,idx)=>`<div class="catalog-item"><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">📄 ${esc(i.name)}</a><button type="button" class="mini-del" data-act="delcat" data-i="${idx}">×</button></div>`).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b)return;const act=b.dataset.act;if(act==="clear"){if(confirm(t("confirmClear"))){state.history=[];persist();renderHistory()}return}if(!confirm(t("confirmDelete")))return;if(act==="delcode"){if(state.codes[b.dataset.brand]){delete state.codes[b.dataset.brand][b.dataset.code];if(!Object.keys(state.codes[b.dataset.brand]).length)delete state.codes[b.dataset.brand]}}else if(act==="delfault"){if(state.faults[b.dataset.dev])delete state.faults[b.dataset.dev][b.dataset.key]}else if(act==="delhist"){state.history=state.history.filter(i=>String(i.id)!==b.dataset.id)}else if(act==="delcat"){state.catalogs.splice(Number(b.dataset.i),1)}persist();renderAll()});
function exportFaults(){const data={customDB:state.faults,customCodes:state.codes,catalogs:state.catalogs,history:state.history};const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="HVAC_Backup_"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importFaults(ev){const file=ev.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const parse=v=>typeof v==="string"?JSON.parse(v):v;const d=JSON.parse(e.target.result);if(!isObj(d))throw 0;const f=parse(d.customDB),c=parse(d.customCodes),k=parse(d.catalogs),h=parse(d.history);if(isObj(f))for(const dev in f)if(isObj(f[dev]))state.faults[dev]=Object.assign({},state.faults[dev]||{},f[dev]);if(isObj(c))for(const b in c)if(isObj(c[b]))state.codes[b]=Object.assign({},state.codes[b]||{},c[b]);if(Array.isArray(k))k.forEach(i=>{if(i&&i.link&&!state.catalogs.some(x=>x.link===i.link))state.catalogs.push({name:String(i.name||i.link),link:String(i.link)})});if(Array.isArray(h))h.forEach(i=>{if(i&&i.id&&!state.history.some(x=>x.id===i.id))state.history.push(i)});state.history=state.history.sort((a,b)=>b.id-a.id).slice(0,50);persist();renderAll();toast(t("importOk"),"ok")}catch{toast(t("importFail"),"err")}ev.target.value=""};reader.readAsText(file)}

function loadLocalPDF(){const file=$("localCatalogInput").files[0];if(!file)return;revokePdfUrl();currentPdfBlobUrl=URL.createObjectURL(file);$("translationBox").style.display="none";if(!pdfReady){toast(t("pdfLibMissing"),"err");window.open(currentPdfBlobUrl,"_blank");return}const reader=new FileReader();reader.onload=e=>{pdfjsLib.getDocument({data:new Uint8Array(e.target.result)}).promise.then(doc=>{pdfDoc=doc;$("pageCount").textContent=doc.numPages;$("pdfViewerContainer").style.display="block";pageNum=1;scale=1.5;renderPage(1)}).catch(err=>toast("PDF: "+err.message,"err"))};reader.readAsArrayBuffer(file)}
function renderPage(num){pageRendering=true;pdfDoc.getPage(num).then(page=>{const viewport=page.getViewport({scale}),canvas=$("pdfCanvas");canvas.height=viewport.height;canvas.width=viewport.width;return page.render({canvasContext:canvas.getContext("2d"),viewport}).promise}).catch(err=>toast("PDF: "+err.message,"err")).then(()=>{pageRendering=false;if(pageNumPending!==null){const n=pageNumPending;pageNumPending=null;renderPage(n)}});$("pageInput").value=num;$("translationBox").style.display="none"}

async function translateTextFree(){if(!pdfDoc)return;const box=$("translationBox"),out=$("translationText");box.style.display="block";out.style.color="#0275d8";out.textContent="...";const src=$("transSrc").value;if(src===currentLang){out.textContent=t("transSame");return}try{const page=await pdfDoc.getPage(pageNum);const tc=await page.getTextContent();const text=tc.items.map(i=>i.str).join(" ").replace(/\s+/g," ").trim();if(text.length<5)throw new Error(t("noText"));const all=chunkText(text,450),chunks=all.slice(0,3),parts=[];for(const c of chunks){const res=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(c)+"&langpair="+src+"|"+currentLang);if(!res.ok)throw new Error("HTTP "+res.status);const data=await res.json();const tt=data&&data.responseData&&data.responseData.translatedText;if(!tt)throw new Error(t("transFail"));parts.push(decodeEntities(tt))}out.textContent=parts.join(" ")+(all.length>chunks.length?" …":"");out.style.color="#333"}catch(err){out.textContent=err.message;out.style.color="red"}}
